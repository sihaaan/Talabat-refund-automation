name: Synthetic refund tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Core integration tests
        shell: powershell
        run: ./Scripts/Test-Refunds.ps1
      - name: Edge-case tests
        shell: powershell
        run: ./Scripts/Test-EdgeCases.ps1
      - name: Extracted package startup
        shell: powershell
        run: ./Scripts/Test-PackagedStartup.ps1
  powershell-seven:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Core integration tests
        shell: pwsh
        run: ./Scripts/Test-Refunds.ps1
      - name: Edge-case tests
        shell: pwsh
        run: ./Scripts/Test-EdgeCases.ps1
      - name: Extracted package startup
        shell: pwsh
        run: ./Scripts/Test-PackagedStartup.ps1
